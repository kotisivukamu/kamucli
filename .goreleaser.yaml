version: 2

project_name: kamu

# kamu is a standalone public repo again (un-folded from the kamuhub monorepo,
# 2026-07-02). Releases run off plain `vX.Y.Z` tags via
# .github/workflows/release.yml. Versions continue the original public line
# (v0.4.1 → v0.5.0) so brew upgrades stay monotonic.

before:
  hooks:
    - go mod tidy

builds:
  - id: kamu
    main: ./cmd/kamu
    binary: kamu
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: kamu
    name_template: "kamu_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: kotisivukamu
    name: kamucli
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  # Re-tagging the same version replaces the release + its assets instead of
  # 422-ing on "asset already_exists", so a re-run of a version is idempotent.
  mode: replace

# Homebrew CASK, not formula: goreleaser deprecated `brews:` in favour of
# `homebrew_casks:` (v2.18 fails `goreleaser check` on it). Casks are also the
# right shape for what we ship — a prebuilt binary, not something brew builds
# from source.
homebrew_casks:
  - name: kamu
    # Publish to the tap only when HOMEBREW_TAP_TOKEN is set. Without it, skip
    # the tap push so the release still ships binaries (go install / direct
    # download) instead of failing the whole release on a 401. Set the secret
    # to auto-enable `brew install kotisivukamu/tap/kamu`.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    repository:
      owner: kotisivukamu
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/kotisivukamu/kamucli"
    description: "Unified CLI for the Kamu platform — drive kamudb, kamubee, and kamudns with one auth"
    binaries:
      - kamu
    # An unsigned binary downloaded by brew carries com.apple.quarantine, which
    # makes macOS refuse to run it as "damaged" — the cask equivalent of the
    # formula's implicit trust. Strip it at install time.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kamu"]
          end
    commit_author:
      name: kamu-release-bot
      email: release-bot@kotisivukamu.fi
    commit_msg_template: "kamu {{ .Tag }}"
